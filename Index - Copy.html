<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptArchitect - Free AI Optimizer</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b0f19; color: #f3f4f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <!-- Main Container Box -->
    <div style="background: #111827; max-width: 500px; width: 100%; padding: 30px; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);">
        
        <!-- App Title -->
        <div style="text-align: center; margin-bottom: 25px;">
            <h1 style="color: #38bdf8; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;">⚡ PromptArchitect</h1>
            <p style="color: #9ca3af; font-size: 14px; margin-top: 5px;">Zero-Cost Frontend Token Optimizer</p>
        </div>

        <!-- Text Input Field Area -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #9ca3af; margin-bottom: 6px; letter-spacing: 0.5px;">Paste Conversational Prompt</label>
            <textarea id="rawPrompt" placeholder="Example: Hey ChatGPT, can you please write me a short essay about..." rows="5" style="width: 100%; padding: 12px; background: #030712; border: 1px solid #374151; border-radius: 8px; color: #f3f4f6; font-size: 14px; resize: none; box-sizing: border-box; font-family: inherit;"></textarea>
        </div>

        <!-- Action Processing Button -->
        <button onclick="optimizePrompt()" style="width: 100%; background: #0284c7; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s;">Optimize Text Architecture →</button>

        <!-- Dynamic Output Section (Hidden initially) -->
        <div id="outputSection" style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #1f2937; display: none;">
            <label style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #10b981; margin-bottom: 6px; letter-spacing: 0.5px;">Optimized Architecture Output</label>
            <div id="optimizedPrompt" style="background: #030712; padding: 14px; border-radius: 8px; font-size: 14px; border: 1px solid #065f46; color: #34d399; min-height: 40px; margin-bottom: 15px; white-space: pre-wrap;"></div>
            
            <!-- Real-Time Metrics -->
            <div style="display: flex; justify-content: space-between; background: #1f2937; padding: 12px; border-radius: 8px; font-size: 13px;">
                <span style="color: #9ca3af;">Estimated Tokens Saved:</span>
                <strong style="color: #38bdf8;" id="tokensSaved">0 tokens</strong>
            </div>
        </div>
    </div>

    <!-- The Logic Engine (Simple JavaScript) -->
    <script>
        function optimizePrompt() {
            let input = document.getElementById('rawPrompt').value;
            if(!input.trim()) return alert("Please paste a prompt first!");

            // Real-time automation rule: Strip out standard filler greetings and polite conversational fluff words
            let cleanText = input
                .replace(/(hey|hello|hi|please|could you|can you|kindly|write me a|give me a)/gi, '')
                .trim();
            
            // Capitalize the first letter of the clean string
            cleanText = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);

            // Display results instantly on screen
            document.getElementById('optimizedPrompt').innerText = cleanText;
            
            // Calculate a dummy mock metric of words saved to show backend optimization logic works
            let savedCount = Math.max(0, input.split(' ').length - cleanText.split(' ').length);
            document.getElementById('tokensSaved').innerText = (savedCount * 2) + " tokens";
            
            document.getElementById('outputSection').style.display = 'block';
        }
    </script>
</body>
</html>
